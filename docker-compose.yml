services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: menyamuhinzi
      POSTGRES_PASSWORD: menyamuhinzi
      POSTGRES_DB: menyamuhinzi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  ai:
    build: ./apps/ai
    env_file: .env
    ports:
      - "8000:8000"
  api:
    build: ./apps/api
    environment:
      AI_URL: http://ai:8000
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - ai
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
